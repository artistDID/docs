<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no"
    />
    <meta name="description" content="artistDID Documentation" />
    <title>artistDID Documentation</title>
    <link rel="icon" href="images/favicon.ico" />
    <link rel="stylesheet" href="css/theme-simple-dark.css" />
    <link rel="stylesheet" href="js/katex/katex.min.css" />
    <style>
      :root {
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <script src="js/katex/katex.min.js"></script>
    <script src="js/katex/auto-render.min.js"></script>
    <script>
      window.$docsify = {
        name: "artistDID Documentation",
        logo: "images/logo.png",
        homepage: "about.md",
        loadSidebar: "sidebar.md",
        auto2top: true,
        maxLevel: 3,
        subMaxLevel: 3,
        plugins: [
          function (hook) {
            hook.doneEach(function () {
              window.renderMathInElement(document.querySelector(".markdown-section"));
            });
          },
        ],
        search: {
          depth: 3,
          noData: "No results!",
          placeholder: "Search...",
        },
        themeable: {
          // readyTransition : false,
          // responsiveTables: false
        },
      };
    </script>
    <!-- Mermaid 10.9.3 and docsify-mermaid 2.0.1 are vendored under js/. -->
    <script src="js/mermaid.min.js"></script>
    <script>
      window.mermaid.initialize({
        startOnLoad: false,
        theme: "base",
        themeVariables: {
          darkMode: true,
          background: "#151515",
          primaryColor: "#2b211e",
          primaryTextColor: "#f5f0ed",
          primaryBorderColor: "#ff4500",
          secondaryColor: "#282828",
          secondaryTextColor: "#e5ded9",
          tertiaryColor: "#202020",
          tertiaryTextColor: "#e5ded9",
          lineColor: "#ff8c5a",
          arrowheadColor: "#ff8c5a",
          edgeLabelBackground: "#282828",
        },
      });
    </script>
    <script src="js/docsify.min.js"></script>
    <script src="js/prism-json.min.js"></script>
    <script src="js/docsify-mermaid.min.js"></script>
    <script src="js/docsify-themeable.min.js"></script>
    <script src="js/search.js"></script>
  </body>
</html>
